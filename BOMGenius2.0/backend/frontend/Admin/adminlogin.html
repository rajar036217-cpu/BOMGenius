<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - BOM Genius</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center
             bg-gradient-to-r from-blue-900 via-white to-blue-900 font-sans">

  <!-- Login Card -->
  <div class="bg-white/30 backdrop-blur-xl border border-white/40
              rounded-2xl shadow-2xl p-10 w-full max-w-md">

    <h1 class="text-3xl font-bold text-center text-blue-900 mb-8">
      BOM Genius – Admin
    </h1>

    <!-- 🔗 action = dashboard page -->
    <form action="dashboard.html" method="get" class="space-y-6">

      <div>
        <label class="block text-blue-900 mb-2 font-medium">
          Admin ID
        </label>
        <input type="text" placeholder="Enter Admin ID" required
          class="w-full p-3 rounded-lg border border-gray-300
                 focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-blue-900 mb-2 font-medium">
          Password
        </label>
        <input type="password" placeholder="Enter Password" required
          class="w-full p-3 rounded-lg border border-gray-300
                 focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Forgot Password -->
      <div class="text-right">
        <a href="forgetpassword.html"
           class="text-sm text-blue-700 hover:underline">
          Forgot Password?
        </a>
      </div>

      <button type="submit"
        class="w-full py-3 rounded-xl bg-blue-900 text-white font-semibold
               hover:bg-blue-800 transition shadow-lg">
        Login
      </button>

    </form>

  </div>

</body>
</html>
