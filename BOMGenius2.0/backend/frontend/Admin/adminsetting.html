<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BOM Genius – Admin | Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .glass {
      backdrop-filter: blur(18px);
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-900 via-white to-blue-900 font-sans">

<!-- ===== NAVBAR ===== -->
<header class="sticky top-0 z-50
               px-10 py-6
               bg-white/30 backdrop-blur-xl
               border-b border-white/40
               shadow-[0_8px_30px_rgba(0,0,0,0.25)]">

  <div class="max-w-7xl mx-auto flex items-center justify-between">

    <!-- LEFT : LOGO + TITLE -->
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 bg-blue-900 text-white rounded-full
                  flex items-center justify-center font-bold text-xl">
        BG
      </div>
      <h1 class="text-2xl font-bold text-blue-900 whitespace-nowrap">
        BOM Genius – Admin
      </h1>
    </div>

    <!-- CENTER : NAV LINKS -->
    <nav class="flex space-x-10 text-lg font-medium text-gray-800">
      <a href="dashboard.html"
         class="hover:text-blue-700 transition">
        Admin Panel
      </a>

      <a href="feedbackview.html"
         class="hover:text-blue-700 transition">
        Feedback View
      </a>

      <a href="feedbackcorrection.html"
         class="hover:text-blue-700 transition">
        Feedback Correction
      </a>

      <a href="adminsetting.html"
         class="text-blue-900 border-b-2 border-blue-900 pb-1"
>
        Settings
      </a>

      <a href="maintenance.html"
         class="hover:text-blue-700 transition">
        Maintenance
      </a>
    </nav>

    <!-- RIGHT : PROFILE -->
    <img src="https://via.placeholder.com/40"
         class="w-10 h-10 rounded-full border-2 border-blue-900
                cursor-pointer hover:scale-110 transition"
         alt="Profile">

  </div>
</header>


<!-- ===== PAGE TITLE ===== -->
<section class="py-16 text-center">
  <h2 class="text-4xl font-bold text-blue-900 mb-2">
    Admin Settings
  </h2>
  <p class="text-gray-700">
    Manage admin profile, security & system preferences
  </p>
</section>

<!-- ===== SETTINGS CONTENT ===== -->
<section class="px-12 pb-24">
  <div class="max-w-5xl mx-auto glass rounded-3xl shadow-2xl p-10 space-y-12">

    <!-- ===== PROFILE SETTINGS ===== -->
    <div>
      <h3 class="text-2xl font-semibold text-blue-900 mb-6">
        Admin Profile
      </h3>

      <div class="grid grid-cols-2 gap-6">
        <input type="text" placeholder="Admin Name"
               class="p-3 rounded-lg border border-gray-300">
        <input type="email" placeholder="Admin Email"
               class="p-3 rounded-lg border border-gray-300">
      </div>

      <button class="mt-6 bg-blue-900 hover:bg-blue-800 text-white px-6 py-2 rounded-lg">
        Update Profile
      </button>
    </div>

    <!-- ===== PASSWORD SETTINGS ===== -->
    <div>
      <h3 class="text-2xl font-semibold text-blue-900 mb-6">
        Change Password
      </h3>

      <div class="grid grid-cols-2 gap-6">
        <input type="password" placeholder="Current Password"
               class="p-3 rounded-lg border border-gray-300">
        <input type="password" placeholder="New Password"
               class="p-3 rounded-lg border border-gray-300">
      </div>

      <button class="mt-6 bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg">
        Update Password
      </button>
    </div>

    <!-- ===== SYSTEM SETTINGS ===== -->
    <div>
      <h3 class="text-2xl font-semibold text-blue-900 mb-6">
        System Settings
      </h3>

      <div class="space-y-4 text-gray-800">
        <label class="flex items-center gap-3">
          <input type="checkbox" class="w-5 h-5 accent-blue-900">
          Enable email notifications for feedback
        </label>

        <label class="flex items-center gap-3">
          <input type="checkbox" class="w-5 h-5 accent-blue-900">
          Allow auto‑approve minor corrections
        </label>
      </div>

      <button class="mt-6 bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg">
        Save Settings
      </button>
    </div>

  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="text-center py-8 text-gray-700 text-sm">
  © 2026 BOM Genius – Admin Panel
</footer>

</body>
</html>
