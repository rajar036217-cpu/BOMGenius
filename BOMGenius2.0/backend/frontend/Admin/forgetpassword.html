<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password – BOM Genius</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center
             bg-gradient-to-r from-blue-900 via-white to-blue-900 font-sans">

  <!-- Forgot Password Card -->
  <div class="bg-white/30 backdrop-blur-xl border border-white/40
              rounded-2xl shadow-2xl p-10 w-full max-w-md">

    <h1 class="text-3xl font-bold text-center text-blue-900 mb-4">
      BOM Genius
    </h1>

    <p class="text-center text-gray-700 mb-8">
      Reset Admin Password
    </p>

    <form class="space-y-6">

      <!-- Email -->
      <div>
        <label class="block text-blue-900 mb-2 font-medium">
          Registered Email ID
        </label>
        <input type="email"
               placeholder="Enter your email"
               class="w-full p-3 rounded-lg border border-gray-300
                      focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <!-- OTP -->
      <div>
        <label class="block text-blue-900 mb-2 font-medium">
          Verification Code
        </label>
        <input type="text"
               placeholder="Enter OTP sent to email"
               class="w-full p-3 rounded-lg border border-gray-300
                      focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <!-- New Password -->
      <div>
        <label class="block text-blue-900 mb-2 font-medium">
          New Password
        </label>
        <input type="password"
               placeholder="Enter new password"
               class="w-full p-3 rounded-lg border border-gray-300
                      focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-blue-900 mb-2 font-medium">
          Confirm Password
        </label>
        <input type="password"
               placeholder="Re-enter new password"
               class="w-full p-3 rounded-lg border border-gray-300
                      focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <!-- Reset Button -->
      <button type="submit"
        class="w-full py-3 rounded-xl bg-blue-900 text-white font-semibold
               hover:bg-blue-800 transition shadow-lg">
        Reset Password
      </button>

      <!-- Back to Login -->
      <div class="text-center">
        <a href="adminlogin.html"
           class="text-sm text-blue-700 hover:underline">
          ← Back to Admin Login
        </a>
      </div>

    </form>

  </div>

</body>
</html>
