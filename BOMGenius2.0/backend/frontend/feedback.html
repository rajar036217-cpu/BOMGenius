<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Federated Learning - BOM Genius</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  .dark-shadow {
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }
  .nav-shadow {
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }

  /* Success Popup */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #22c55e;
    color: white;
    padding: 14px 22px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    font-weight: 600;
    opacity: 0;
    transform: translateY(-20px);
    transition: all 0.4s ease;
    z-index: 9999;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>

<body class="min-h-screen bg-gradient-to-r from-[#87CEFA] via-white to-[#C8A2C8] text-black font-sans">

<!-- NAVBAR -->
<header class="flex justify-between items-center px-10 py-6
               bg-[#87CEFA]/40 backdrop-blur-xl
               border-b border-[#C8A2C8]
               nav-shadow sticky top-0 z-50">

  <h1 class="text-3xl font-bold text-[#5A4E7C]">
    BOM Genius
  </h1>

  <nav class="flex space-x-10 text-lg font-medium">
    <a href="home.html" class="hover:text-[#C8A2C8]">Home</a>
    <a href="fullbomconverter.html" class="hover:text-[#C8A2C8]">BOM Converter</a>
    <a href="feedback.html" class="text-[#5A4E7C] border-b-2 border-[#C8A2C8] pb-1">Federated Learning</a>
    <a href="settings.html" class="hover:text-[#C8A2C8]">Settings</a>
    <a href="history.html" class="hover:text-[#C8A2C8]">History</a>
  </nav>

</header>

<!-- FORM -->
<section class="px-10 py-16 max-w-4xl mx-auto">

  <h2 class="text-4xl font-bold text-center text-[#5A4E7C] mb-12">
    M-BOM Correction
  </h2>

  <div class="space-y-8">

    <div class="bg-[#F1F3F6] rounded-2xl p-6 dark-shadow">
      <label class="block text-lg mb-3 text-[#5A4E7C] font-semibold">
        Upload E-BOM item
      </label>
      <textarea id="ebom"
        class="w-full p-4 rounded-xl border border-gray-300"
        rows="3"
        placeholder="Enter E-BOM details here..."></textarea>
    </div>

    <div class="bg-[#F1F3F6] rounded-2xl p-6 dark-shadow">
      <label class="block text-lg mb-3 text-[#5A4E7C] font-semibold">
        Generated M-BOM item
      </label>
      <textarea id="generated"
        class="w-full p-4 rounded-xl border border-gray-300"
        rows="3"
        placeholder="Enter generated M-BOM details..."></textarea>
    </div>

    <div class="bg-[#F1F3F6] rounded-2xl p-6 dark-shadow">
      <label class="block text-lg mb-3 text-[#5A4E7C] font-semibold">
        Expected / Actual M-BOM
      </label>
      <textarea id="expected"
        class="w-full p-4 rounded-xl border border-gray-300"
        rows="3"
        placeholder="Enter correct M-BOM output..."></textarea>
    </div>

    <div class="flex space-x-6 mt-6">
      <button onclick="submitFeedback()"
        class="bg-[#C8A2C8] text-white hover:bg-[#B58FB5] px-8 py-3 rounded-lg font-semibold dark-shadow">
        Submit
      </button>

      <button onclick="resetForm()"
        class="bg-[#5A4E7C] text-white hover:bg-[#4B4067] px-8 py-3 rounded-lg font-semibold dark-shadow">
        Reset
      </button>
    </div>

  </div>
</section>

<!-- SUCCESS TOAST -->
<div id="successToast" class="toast">
  mBOM generated successfully ✔
</div>

<script>
const API_BASE = "http://127.0.0.1:8000";

/* Submit Feedback */
async function submitFeedback(){

  const ebom = document.getElementById("ebom").value.trim();
  const generated = document.getElementById("generated").value.trim();
  const expected = document.getElementById("expected").value.trim();

  if(!ebom || !generated || !expected){
      alert("Please fill all fields.");
      return;
  }

  const payload = {
      ebom_part: ebom,
      ai_matched_part: generated,
      correct_part: expected
  };

  try {
      const response = await fetch(`${API_BASE}/feedback`, {
          method: "POST",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
      });

      if(response.ok){
          showToast();   // ✅ POPUP TRIGGER
      } else {
          alert("Submission failed.");
      }

  } catch(error){
      alert("Server connection failed.");
  }
}

/* Success Popup Function */
function showToast(){
  const toast = document.getElementById("successToast");
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

/* Reset */
function resetForm(){
  document.getElementById("ebom").value="";
  document.getElementById("generated").value="";
  document.getElementById("expected").value="";
}
</script>

<footer class="text-center py-6 text-[#6E6E8A] text-sm">
  © 2026 BOM Genius. All rights reserved.
</footer>

</body>
</html>
