<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOM History - BOM Genius</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  .dark-shadow {
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
  }

  .nav-shadow {
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
  }
</style>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-900 via-white to-blue-900 text-black font-sans">

<!-- ===== NAVBAR ===== -->
<header class="flex justify-between items-center px-10 py-6
               bg-white/30 backdrop-blur-xl
               border-b border-white/40
               nav-shadow sticky top-0 z-50">

  <h1 class="text-3xl font-bold text-blue-900">
    BOM Genius
  </h1>

  <nav class="flex space-x-10 text-lg font-medium">
    <a href="home.html" class="hover:text-blue-700">Home</a>
    <a href="fullbomconverter.html" class="hover:text-blue-700">BOM Converter</a>
    <a href="feedback.html" class="hover:text-blue-700">Feedback</a>
    <a href="settings.html" class="hover:text-blue-700">Settings</a>
    <a href="history.html"
       class="text-blue-900 border-b-2 border-blue-900 pb-1">
      History
    </a>
  </nav>
</header>

<!-- ===== HISTORY SECTION ===== -->
<section class="px-10 py-16">

  <h2 class="text-4xl font-bold text-center text-blue-900 mb-12">
    E-BOM Generation History
  </h2>

  <div class="max-w-6xl mx-auto bg-white/90 backdrop-blur-md
              rounded-2xl dark-shadow overflow-hidden">

    <table class="w-full text-left">

      <thead class="bg-blue-900 text-white text-lg">
        <tr>
          <th class="p-4">Date</th>
          <th class="p-4">Time</th>
          <th class="p-4">Rows</th>
          <th class="p-4">Status</th>
          <th class="p-4">Action</th>
        </tr>
      </thead>

      <tbody id="historyTable" class="text-gray-800">
        <!-- API DATA WILL LOAD HERE -->
      </tbody>

    </table>

  </div>

</section>

<footer class="text-center py-6 text-gray-700 text-sm">
  © 2026 BOM Genius. All rights reserved.
</footer>

<!-- ===== API SCRIPT ===== -->
<script>

async function loadHistory() {
  try {

    const response = await fetch("http://127.0.0.1:8000/mbom/history", {
      method: "GET",
      headers: {
        "Content-Type": "application/json"
      }
    });

    const data = await response.json();

    const table = document.getElementById("historyTable");
    table.innerHTML = "";

    if (!data || data.length === 0) {
      table.innerHTML = `
        <tr>
          <td colspan="5" class="p-6 text-center text-gray-500">
            No history available
          </td>
        </tr>
      `;
      return;
    }

    data.forEach(item => {

      const row = document.createElement("tr");
      row.className = "border-t hover:bg-blue-100 transition";

      row.innerHTML = `
        <td class="p-4">${item.date}</td>
        <td class="p-4">${item.time}</td>
        <td class="p-4">${item.rows}</td>
        <td class="p-4 text-green-600 font-medium">Generated</td>
        <td class="p-4">
          <button onclick="viewMBOM('${item.timestamp}')"
            class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm">
            View
          </button>
        </td>
      `;

      table.appendChild(row);
    });

  } catch (error) {
    console.error("Error loading history:", error);

    document.getElementById("historyTable").innerHTML = `
      <tr>
        <td colspan="5" class="p-6 text-center text-red-500">
          Failed to load history
        </td>
      </tr>
    `;
  }
}

function viewMBOM(timestamp) {
  window.location.href = "view.html?ts=" + encodeURIComponent(timestamp);
}

document.addEventListener("DOMContentLoaded", loadHistory);

</script>

</body>
</html>
