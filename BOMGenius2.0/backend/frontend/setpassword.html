<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Set New Password</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center
bg-gradient-to-r from-blue-900 via-white to-blue-900 font-sans">

<div class="bg-white/90 rounded-2xl p-10 w-full max-w-md shadow-2xl">

<h1 class="text-2xl font-bold text-center text-blue-900 mb-6">
Set New Password
</h1>

<form onsubmit="resetPassword(event)" class="space-y-4">

<input type="password" id="newPassword"
placeholder="New Password"
class="w-full p-3 rounded-lg border border-blue-300"
required>

<input type="password" id="confirmPassword"
placeholder="Confirm Password"
class="w-full p-3 rounded-lg border border-blue-300"
required>

<button type="submit"
class="w-full py-3 rounded-xl bg-blue-900 text-white font-semibold">
Set Password
</button>

</form>

</div>

<script>
function resetPassword(e) {
e.preventDefault();

alert("Password updated successfully");

window.location.href = "userlogin.html";
}
</script>

</body>
</html>
