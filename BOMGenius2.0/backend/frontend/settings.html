<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings - BOM Genius</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .dark-shadow {
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
  }
  .nav-shadow {
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
  }
  .active-text {
    color: #1e3a8a; /* blue-900 */
    font-weight: 700;
    transition: all 0.3s ease;
  }

  .inactive-text {
    color: #9ca3af; /* gray-400 */
    transition: all 0.3s ease;
  }
</style>
</head>

<body class="min-h-screen bg-gradient-to-r from-[#87CEFA] via-white to-[#C8A2C8] text-black font-sans">

<!-- ===== NAVBAR ===== -->
<header class="sticky top-0 z-50 flex justify-between items-center px-12 py-6
               bg-white/30 backdrop-blur-xl border-b border-white/40 nav-shadow">

  <h1 class="text-3xl font-bold text-[#5A4E7C]">
    BOM Genius
  </h1>

  <nav class="flex space-x-10 text-lg font-medium">
  
    <a href="home.html" 
       class="hover:text-blue-700">
       Home
    </a>
    <a href="fullbomconverter.html" class="hover:text-blue-700">BOM converter</a>
    <a href="feedback.html" class="hover:text-blue-700">Federated Learning</a>
    <a href="settings.html" class="text-blue-900 border-b-2 border-blue-900 pb-1">Settings</a>
    <a href="history.html" class="hover:text-blue-700">History</a> 
  </nav>

  <div class="relative">
    <button onclick="toggleDropdown()"
            class="flex items-center gap-2 focus:outline-none">
      Company:
      <span class="font-semibold" id="cname"></span>
      <svg class="w-4 h-4 mt-1" fill="none" stroke="currentColor"
           stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    <div id="companyDropdown"
         class="hidden absolute right-0 mt-3 w-40
                bg-white rounded-xl shadow-lg
                border border-[#E0E0E0]">

      <button onclick="logout()"
        class="w-full text-left px-5 py-3
               text-red-600 hover:bg-[#F1F3F6] font-medium">
        Logout
      </button>

    </div>
  </div>
</header>

<!-- ===== SETTINGS SECTION ===== -->
<section class="px-10 py-16">

  <h2 class="text-4xl font-bold text-center text-[#5A4E7C] mb-12">
    Application Settings
  </h2>

  <div class="max-w-4xl mx-auto space-y-8">

    <!-- Profile Settings -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-8 dark-shadow">

      <h3 class="text-2xl font-semibold text-[#5A4E7C] mb-6">
        Profile Settings
      </h3>

      <div class="space-y-4">

        <input id="companyName" type="text" placeholder="Company Name"
          class="w-full p-3 rounded-lg border border-gray-300">

        <input id="companyEmail" type="email" placeholder="Company Email"
          class="w-full p-3 rounded-lg border border-gray-300">

        <input id="password" type="password" placeholder="Change Password"
          class="w-full p-3 rounded-lg border border-gray-300">

      </div>
    </div>

    <!-- Save Button -->
    <div class="text-center mt-10">
      <button onclick="saveSettings()"
        class="bg-[#5A4E7C] hover:bg-[#4a4068] text-white
               px-10 py-4 rounded-xl font-semibold dark-shadow">
        Save Changes
      </button>
    </div>

  </div>
</section>

<script>

    let cname=document.getElementById("cname")
  cname.innerText=localStorage.getItem("companyname")

function logout() {
  window.location.href = "/frontend/role.html";
}

function toggleDropdown() {
  document.getElementById("companyDropdown").classList.toggle("hidden");
}

const API_BASE = "http://127.0.0.1:8000";

/* ================= LOAD SETTINGS ================= */
async function loadSettings() {
  try {
    const response = await fetch(`${API_BASE}/get-settings`);
    const data = await response.json();

    document.getElementById("companyName").value = data.company_name || "";
    document.getElementById("companyEmail").value = data.company_email || "";

  } catch (error) {
    console.error("Error loading settings:", error);
  }
}

/* ================= SAVE SETTINGS ================= */
async function saveSettings() {

  const settingsData = {
    company_name: document.getElementById("companyName").value,
    company_email: document.getElementById("companyEmail").value,
    password: document.getElementById("password").value
  };

  try {
    const response = await fetch(`${API_BASE}/save-settings`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(settingsData)
    });

    const result = await response.json();
    alert(result.message);

  } catch (error) {
    console.error("Error saving settings:", error);
  }
}

/* ================= DROPDOWN ================= */
function toggleDropdown() {
  document.getElementById("companyDropdown")
    .classList.toggle("hidden");
}

function logout() {
  window.location.href = "role.html";
}

/* Load settings when page loads */
window.onload = loadSettings;
</script>

</body>
</html>
