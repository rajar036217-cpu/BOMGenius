<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center
bg-gradient-to-r from-blue-900 via-white to-blue-900 font-sans">

<div class="bg-white/90 backdrop-blur-md rounded-2xl p-10 w-full max-w-md shadow-2xl">

<h1 class="text-2xl font-bold text-center text-blue-900 mb-6">
Password Recovery
</h1>

<form id="forgotForm" class="space-y-4">

<label class="block text-blue-900 font-medium">
Company Email ID
</label>

<input type="email" id="email"
class="w-full p-3 rounded-lg border border-blue-300 focus:ring-2 focus:ring-blue-500"
required>

<button type="submit"
class="w-full py-3 rounded-xl bg-blue-800 text-white font-semibold hover:bg-blue-900">
Send Set Password Link
</button>

</form>

</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async function(e) {
e.preventDefault();

const email = document.getElementById("email").value;

await fetch("http://localhost:5000/send-reset-link", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ email })
});

alert("Reset link sent to your email");
});
</script>

</body>
</html>
