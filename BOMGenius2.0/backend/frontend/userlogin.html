<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BOM Genius Login</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .dark-shadow {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-900 via-white to-blue-900 flex items-center justify-center text-black font-sans">

    <!-- Login Card -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-10 w-full max-w-md dark-shadow">

        <h1 class="text-3xl font-bold text-center text-blue-900 mb-8">
            BOM Genius
        </h1>

        <!-- FORM -->
        <form id="loginForm" class="space-y-6">

            <!-- Company Name -->
            <div>
                <label class="block mb-2 font-medium text-blue-900">
                    Company Name
                </label>
                <input type="text"
                    id="companyName"
                    placeholder="Enter Company Name"
                    required
                    class="w-full p-3 rounded-lg border border-blue-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Company ID -->
            <div>
                <label class="block mb-2 font-medium text-blue-900">
                    Company ID
                </label>
                <input type="text"
                    id="companyId"
                    placeholder="Enter Company ID"
                    required
                    class="w-full p-3 rounded-lg border border-blue-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Password -->
            <div>
                <label class="block mb-2 font-medium text-blue-900">
                    Password
                </label>
                <input type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                    class="w-full p-3 rounded-lg border border-blue-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Forgot Password -->
            <div class="text-right">
                <a href="userforgotpassword.html"
                   class="text-sm text-blue-700 hover:underline">
                    Forgot Password?
                </a>
            </div>

            <!-- Sign In Button -->
            <button type="submit"
                class="w-full py-3 rounded-xl bg-blue-800 hover:bg-blue-900 transition text-white font-semibold text-lg">
                Sign In
            </button>

        </form>

    </div>

    <!-- ================= API SCRIPT ================= -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const companyName = document.getElementById("companyName").value;
            const companyId = document.getElementById("companyId").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("http://127.0.0.1:8000/userlogin", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        company_name: companyName,
                        company_id: companyId,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Login Successful ✅");
                    window.location.href = "home.html";
                } else {
                    alert(data.message || "Login Failed ❌");
                }

            } catch (error) {
                alert("Server Error ⚠️ Make sure backend is running.");
            }
        });
    </script>

</body>
</html>
