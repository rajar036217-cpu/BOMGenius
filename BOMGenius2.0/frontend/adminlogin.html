<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - BOM Genius</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-900 via-white to-blue-900 flex items-center justify-center font-sans">

<div class="bg-white/30 backdrop-blur-xl border border-white/40 shadow-2xl rounded-3xl p-10 w-full max-w-md">

    <h2 class="text-3xl font-bold text-center text-blue-900 mb-8">
        Admin Login
    </h2>

    <form action="admin-dashboard.html" class="space-y-6">

        <!-- Admin ID -->
        <div>
            <label class="block text-blue-900 font-medium mb-2">
                Admin ID
            </label>
            <input type="text"
                   placeholder="Enter Admin ID"
                   class="w-full p-3 rounded-xl border border-blue-300 focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <!-- Password -->
        <div>
            <label class="block text-blue-900 font-medium mb-2">
                Password
            </label>
            <input type="password"
                   placeholder="Enter Password"
                   class="w-full p-3 rounded-xl border border-blue-300 focus:ring-2 focus:ring-blue-600 outline-none">
        </div>

        <!-- Login Button -->
        <button type="submit"
                class="w-full bg-blue-900 text-white py-3 rounded-xl font-semibold hover:bg-blue-800 transition">
            Login
        </button>

        <!-- Forgot Password -->
        <div class="text-center">
            <a href="admin-forgot-password.html"
               class="text-blue-900 font-medium hover:underline">
               Forgot Password?
            </a>
        </div>

    </form>

</div>

</body>
</html>
