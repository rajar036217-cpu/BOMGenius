<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - BOM Genius</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .dark-shadow {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-900 via-white to-blue-900 flex items-center justify-center text-black font-sans">

    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-10 w-full max-w-md dark-shadow">

        <h1 class="text-2xl font-bold text-center text-blue-900 mb-6">
            Password Recovery
        </h1>

        <!-- STEP 1 -->
        <div id="step1">
            <label class="block mb-2 font-medium text-blue-900">
                Company Email ID
            </label>

            <input type="email"
                placeholder="Enter Company Email"
                class="w-full p-3 rounded-lg border border-blue-300 mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">

            <button onclick="goToStep2()"
                class="w-full py-3 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-semibold">
                Send Verification Code
            </button>
        </div>

        <!-- STEP 2 -->
        <div id="step2" class="hidden mt-4">

            <label class="block mb-2 font-medium text-blue-900">
                Enter Verification Code
            </label>

            <input type="text"
                placeholder="Enter 6-digit Code"
                class="w-full p-3 rounded-lg border border-blue-300 mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">

            <button
                class="w-full py-3 rounded-xl bg-blue-700 hover:bg-green-800 text-white font-semibold">
                Verify & Reset Password
            </button>
        </div>

    </div>

    <script>
        function goToStep2() {
            document.getElementById("step1").classList.add("hidden");
            document.getElementById("step2").classList.remove("hidden");
        }
    </script>

</body>
</html>
