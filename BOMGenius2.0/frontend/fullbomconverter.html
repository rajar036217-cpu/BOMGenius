<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOM Converter</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  .dark-shadow {
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
  }

  .nav-shadow {
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  }

  /* Only added this */
  .disabled-box {
    opacity: 0.4;
    pointer-events: none;
  }
</style>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-900 via-white to-blue-900 text-black font-sans">

<!-- ===== NAVBAR ===== -->
<header class="sticky top-0 z-50 flex justify-between items-center px-12 py-6
               bg-white/30 backdrop-blur-xl border-b border-white/40 nav-shadow">

  <h1 class="text-3xl font-bold text-blue-900">
    BOM Genius
  </h1>

  <nav class="flex space-x-10 text-lg font-medium">
    <a href="home.html" class="hover:text-blue-700">Home</a>
    <a href="fullbomconverter.html"
       class="text-blue-900 border-b-2 border-blue-900 pb-1">
       BOM Converter
    </a>
    <a href="feedback.html" class="hover:text-blue-700">Feedback</a>
    <a href="settings.html" class="hover:text-blue-700">Settings</a>
    <a href="history.html" class="hover:text-blue-700">History</a>
  </nav>

  <!-- COMPANY DROPDOWN -->
  <div class="relative">
    <button onclick="toggleDropdown()"
      class="font-medium text-blue-900 flex items-center space-x-2">
      <span>Company:</span>
      <span class="font-semibold">ABC Industries</span>
      <svg class="w-4 h-4 mt-1" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <div id="companyDropdown"
         class="hidden absolute right-0 mt-3 w-40 bg-white rounded-xl shadow-lg border">
      <button onclick="logout()"
        class="w-full text-left px-5 py-3 text-red-600 hover:bg-red-50 font-medium">
        Logout
      </button>
    </div>
  </div>
</header>

<!-- ===== PAGE TITLE ===== -->
<section class="py-16 text-center">
  <h2 class="text-4xl font-bold text-blue-900 mb-4">
    BOM Converter
  </h2>
  <p class="text-gray-700">
    Upload Engineering BOM and Factory Inventory to generate Manufacturing BOM
  </p>
</section>

<!-- ===== FILE UPLOAD ===== -->
<section class="px-12 pb-20">

  <div class="grid md:grid-cols-2 gap-14 max-w-6xl mx-auto">

    <!-- Engineering BOM -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-10 dark-shadow">
      <h3 class="text-2xl font-semibold text-blue-900 mb-4">
        Upload Engineering BOM
      </h3>
      <input type="file"
        class="w-full p-4 rounded-lg border border-gray-300 bg-white">
    </div>

    <!-- Factory Inventory -->
    <div id="inventoryBox"
      class="bg-white/90 backdrop-blur-md rounded-2xl p-10 dark-shadow">
      <h3 class="text-2xl font-semibold text-blue-900 mb-4">
        Upload Factory Inventory
      </h3>
      <input type="file"
        class="w-full p-4 rounded-lg border border-gray-300 bg-white">
    </div>

  </div>

  <!-- TOGGLE -->
  <div class="flex justify-center items-center mt-10 space-x-4">
    <span class="font-medium">Without Inventory</span>

    <label class="relative inline-flex items-center cursor-pointer">
      <input type="checkbox" id="inventoryToggle"
             class="sr-only peer"
             onchange="handleToggle()">
      <div class="w-14 h-8 bg-gray-300 rounded-full peer peer-checked:bg-blue-700
                  after:content-[''] after:absolute after:top-1 after:left-1
                  after:bg-white after:w-6 after:h-6 after:rounded-full
                  after:transition-all peer-checked:after:translate-x-6">
      </div>
    </label>

    <span class="font-medium">With Inventory</span>
  </div>

  <div class="text-center mt-16">
    <button onclick="generateMBOM()"
      class="bg-blue-600 hover:bg-blue-700 px-12 py-4 rounded-xl text-lg font-semibold text-white dark-shadow">
      Generate M-BOM
    </button>
  </div>

</section>

<!-- ===== SCRIPT ===== -->
<script>

function toggleDropdown() {
  document.getElementById("companyDropdown").classList.toggle("hidden");
}

function logout() {
  window.location.href = "role.html";
}

document.addEventListener("click", function (event) {
  if (!event.target.closest(".relative")) {
    document.getElementById("companyDropdown")
      .classList.add("hidden");
  }
});

/* Only added this function */
function handleToggle() {
  const toggle = document.getElementById("inventoryToggle").checked;
  const inventoryBox = document.getElementById("inventoryBox");

  if (toggle) {
    inventoryBox.classList.remove("disabled-box");
  } else {
    inventoryBox.classList.add("disabled-box");
  }
}

/* Default OFF state */
handleToggle();

/* Your existing logic */
function generateMBOM() {
  const useInventory = document.getElementById("inventoryToggle").checked;

  if (useInventory) {
    alert("M-BOM generated WITH Factory Inventory");
  } else {
    alert("M-BOM generated WITHOUT Factory Inventory");
  }
}

</script>

<!-- ===== FOOTER ===== -->
<footer class="text-center py-8 text-gray-700 text-sm">
  © 2026 BOM Genius. All rights reserved.
</footer>

</body>
</html>
