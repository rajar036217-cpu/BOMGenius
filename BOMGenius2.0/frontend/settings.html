<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings - BOM Genius</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  .dark-shadow {
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
  }

  .nav-shadow {
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
  }
</style>
</head>

<body class="min-h-screen bg-gradient-to-r from-blue-900 via-white to-blue-900 text-black font-sans">

<!-- ===== GLASS NAVBAR ===== -->
<header class="flex justify-between items-center px-10 py-6
               bg-white/30 backdrop-blur-xl
               border-b border-white/40
               nav-shadow sticky top-0 z-50">

  <h1 class="text-3xl font-bold text-blue-900">
    BOM Genius
  </h1>

  <nav class="flex space-x-10 text-lg font-medium">
    <a href="home.html" class="hover:text-blue-700">Home</a>
    <a href="fullbomconverter.html" class="hover:text-blue-700">BOM Converter</a>
    <a href="feedback.html" class="hover:text-blue-700">Feedback</a>
    <a href="settings.html"
       class="text-blue-900 border-b-2 border-blue-900 pb-1">Settings</a>
    <a href="history.html" class="hover:text-blue-700">History</a>
  </nav>

  <!-- ===== COMPANY DROPDOWN ===== -->
  <div class="relative">
    <button onclick="toggleDropdown()"
      class="font-medium text-blue-900 flex items-center space-x-2 focus:outline-none">
      <span>Company:</span>
      <span class="font-semibold">ABC Industries</span>
      <svg class="w-4 h-4 mt-1" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Dropdown -->
    <div id="companyDropdown"
         class="hidden absolute right-0 mt-3 w-40
                bg-white rounded-xl shadow-lg
                border border-gray-200 overflow-hidden z-50">

      <button onclick="logout()"
        class="w-full text-left px-5 py-3
               text-red-600 hover:bg-red-50 font-medium">
        Logout
      </button>

    </div>
  </div>

</header>

<!-- ===== SETTINGS SECTION ===== -->
<section class="px-10 py-16">

  <h2 class="text-4xl font-bold text-center text-blue-900 mb-12">
    Application Settings
  </h2>

  <div class="max-w-4xl mx-auto space-y-8">

    <!-- Profile Settings -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-8 dark-shadow">
      <h3 class="text-2xl font-semibold text-blue-900 mb-6">
        Profile Settings
      </h3>

      <div class="space-y-4">
        <input type="text" placeholder="Company Name"
          class="w-full p-3 rounded-lg border border-gray-300">

        <input type="email" placeholder="Company Email"
          class="w-full p-3 rounded-lg border border-gray-300">

        <input type="password" placeholder="Change Password"
          class="w-full p-3 rounded-lg border border-gray-300">
      </div>
    </div>

    <!-- Notification Settings -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-8 dark-shadow">
      <h3 class="text-2xl font-semibold text-blue-900 mb-6">
        Notification Preferences
      </h3>

      <div class="space-y-4">
        <label class="flex items-center space-x-3">
          <input type="checkbox" class="w-5 h-5">
          <span>Email Notifications for BOM Generation</span>
        </label>

        <label class="flex items-center space-x-3">
          <input type="checkbox" class="w-5 h-5">
          <span>Accuracy Improvement Alerts</span>
        </label>

        <label class="flex items-center space-x-3">
          <input type="checkbox" class="w-5 h-5">
          <span>System Update Notifications</span>
        </label>
      </div>
    </div>

    <!-- System Preferences -->
    <div class="bg-white/90 backdrop-blur-md rounded-2xl p-8 dark-shadow">
      <h3 class="text-2xl font-semibold text-blue-900 mb-6">
        System Preferences
      </h3>

      <div class="space-y-4">
        <select class="w-full p-3 rounded-lg border border-gray-300">
          <option>Default File Format - Excel</option>
          <option>CSV</option>
          <option>PDF</option>
        </select>

        <select class="w-full p-3 rounded-lg border border-gray-300">
          <option>Language - English</option>
          <option>Tamil</option>
        </select>
      </div>
    </div>

    <!-- Save Button -->
    <div class="text-center mt-10">
      <button
        class="bg-blue-900 hover:bg-blue-800 text-white
               px-10 py-4 rounded-xl font-semibold dark-shadow">
        Save Changes
      </button>
    </div>

  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="text-center py-6 text-gray-700 text-sm">
  © 2026 BOM Genius. All rights reserved.
</footer>

<!-- ===== SCRIPT ===== -->
<script>
  function toggleDropdown() {
    document.getElementById("companyDropdown")
      .classList.toggle("hidden");
  }

  function logout() {
    window.location.href = "role.html";
  }

  // Close dropdown when clicking outside
  document.addEventListener("click", function (event) {
    const dropdown = document.getElementById("companyDropdown");
    if (!event.target.closest(".relative")) {
      dropdown.classList.add("hidden");
    }
  });
</script>

</body>
</html>
